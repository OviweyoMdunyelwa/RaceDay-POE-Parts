# inside jobs.part2-api-tests.steps
- name: Locate projects (Part 2 nested)
  id: part2
  shell: bash
  run: |
    api=$(find "Part 2/Part 2" -type f -name 'RaceDay.API.csproj' -print -quit)
    tests=$(find "Part 2/Part 2" -type f -name 'RaceDay.API.Tests.csproj' -print -quit)

    if [ -z "$api" ]; then
      echo "RaceDay.API.csproj was not found under Part 2/Part 2."
      exit 1
    fi
    if [ -z "$tests" ]; then
      echo "RaceDay.API.Tests.csproj was not found under Part 2/Part 2."
      exit 1
    fi

    echo "api=$api" >> "$GITHUB_OUTPUT"
    echo "tests=$tests" >> "$GITHUB_OUTPUT"
    echo "Found API: $api"
    echo "Found Tests: $tests"

- name: Restore API
  run: dotnet restore "${{ steps.part2.outputs.api }}"

- name: Build API
  run: dotnet build "${{ steps.part2.outputs.api }}" --configuration Release --no-restore

- name: Restore tests
  run: dotnet restore "${{ steps.part2.outputs.tests }}"

- name: Run automated tests
  run: dotnet test "${{ steps.part2.outputs.tests }}" --configuration Release --no-build

