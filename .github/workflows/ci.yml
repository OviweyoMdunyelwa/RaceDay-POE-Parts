name: RaceDay CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  part1-check:
    name: Part 1 - SQL Files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check SQL scripts
        run: |
          test -d "Part 1/SQL_Queries"
          find "Part 1/SQL_Queries" -type f -name "*.sql" | grep -q .
          echo "Part 1 SQL files found."

  part2-check:
    name: Part 2 - Project Files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check API and test project files
        shell: bash
        run: |
          set -euo pipefail

          api=$(find "Part 2" -type f -name "RaceDay.API.csproj" -print -quit)
          tests=$(find "Part 2" -type f -name "RaceDay.API.Tests.csproj" -print -quit)

          if [ -z "$api" ]; then
            echo "::error::API project file not found."
            exit 1
          fi

          if [ -z "$tests" ]; then
            echo "::error::Test project file not found."
            exit 1
          fi

          echo "API project found: $api"
          echo "Test project found: $tests"
          echo "Part 2 project-file check passed."
