name: RaceDay Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  part1-check:
    name: Part 1 - Database Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SQL scripts
        shell: bash
        run: |
          set -euo pipefail

          SQL_DIR="Part 1/SQL_Queries"

          if [ ! -d "$SQL_DIR" ]; then
            echo "::error::Part 1/SQL_Queries folder is missing."
            exit 1
          fi

          count=$(find "$SQL_DIR" -type f -name '*.sql' | wc -l)

          if [ "$count" -eq 0 ]; then
            echo "::error::No SQL scripts were found."
            exit 1
          fi

          echo "PASS: Found $count SQL script(s)."

  part2-build-and-test:
    name: Part 2 - API Build and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Locate API project
        id: api
        shell: bash
        run: |
          set -euo pipefail

          file=$(find "Part 2" -type f -name 'RaceDay.API.csproj' -print -quit)

          if [ -z "$file" ]; then
            echo "::error::RaceDay.API.csproj was not found."
            exit 1
          fi

          echo "API project found: $file"
          echo "path=$file" >> "$GITHUB_OUTPUT"

      - name: Restore API dependencies
        run: dotnet restore "${{ steps.api.outputs.path }}"

      - name: Build API
        run: dotnet build "${{ steps.api.outputs.path }}" --configuration Release --no-restore

      - name: Locate test project
        id: tests
        shell: bash
        run: |
          set -euo pipefail

          file=$(find "Part 2" -type f -name 'RaceDay.API.Tests.csproj' -print -quit)

          if [ -z "$file" ]; then
            echo "::error::RaceDay.API.Tests.csproj was not found."
            exit 1
          fi

          echo "Test project found: $file"
          echo "path=$file" >> "$GITHUB_OUTPUT"

      - name: Restore test dependencies
        run: dotnet restore "${{ steps.tests.outputs.path }}"

      - name: Build test project
        run: dotnet build "${{ steps.tests.outputs.path }}" --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test "${{ steps.tests.outputs.path }}" --configuration Release --no-build
